[global]
    workgroup = WORKGROUP
    server string = %h Fedora bootc file and printer server
    security = user
    map to guest = Never
    guest ok = no
    obey pam restrictions = yes
    server min protocol = SMB2
    load printers = yes
    printing = cups
    printcap name = cups
    cups options = raw
    disable spoolss = no

    # Keep Samba's private database in persistent state on bootc.
    private dir = /var/lib/samba/private
    state directory = /var/lib/samba
    cache directory = /var/cache/samba

[homes]
    comment = Home directories
    browseable = no
    read only = no
    valid users = %S
    create mask = 0660
    directory mask = 0770

[shared]
    comment = Shared files
    path = /srv/samba/shared
    browseable = yes
    read only = no
    force group = users
    create mask = 0660
    directory mask = 2770

[printers]
    comment = All CUPS printers
    path = /var/spool/samba
    browseable = no
    printable = yes
    read only = yes
    guest ok = no

# Explicit queue shares make the printers visible to Android SMB clients even
# when the client does not browse Samba's dynamically generated [printers]
# collection.
[konica206]
    comment = Konica Minolta bizhub 206
    printer name = konica206
    path = /var/spool/samba
    printable = yes
    browseable = yes
    read only = yes
    guest ok = no

[EPSON_L3260]
    comment = Epson L3260
    printer name = EPSON_L3260
    path = /var/spool/samba
    printable = yes
    browseable = yes
    read only = yes
    guest ok = no
