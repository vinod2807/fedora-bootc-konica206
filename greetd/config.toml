[terminal]
# greetd takes VT1; getty@tty1 is conflicted out by the packaged unit.
# Ctrl+Alt+F2 still gives a text login for troubleshooting.
vt = 1

[default_session]
# tuigreet is a console greeter; it authenticates via PAM and then execs the
# LXQt Wayland session (labwc compositor) as the logged-in user.
command = "tuigreet --time --remember --cmd /usr/bin/startlxqtwayland"
user = "greetd"

[initial_session]
# Autologin: greetd starts the LXQt Wayland session (labwc compositor) at boot
# for vinod. When the session ends, greetd returns to tuigreet for a normal login.
command = "/usr/bin/startlxqtwayland"
user = "vinod"
