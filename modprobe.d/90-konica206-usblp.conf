# PAPPL claims the bizhub 206 through libusb. The in-kernel usblp driver also
# binds printer-class USB devices, which makes the interface busy and produces
# "Unable to claim USB interface: Resource busy" races at boot (see
# docs/PRINTER.md). Printing goes through PAPPL/IPP, not the usblp device node,
# so keep usblp out of the way.
blacklist usblp
