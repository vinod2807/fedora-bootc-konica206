# Belt-and-braces copy of the audio power-save settings from
# https://github.com/vinod2807/linux-pc-crash-fixes. The kernel arguments in
# /usr/lib/bootc/kargs.d/90-linux-pc-crash-fixes.toml are the primary mechanism;
# these module options also cover a system where the module was already loaded
# or the kernel parameter was lost.
options snd_hda_intel power_save=0 power_save_controller=N
