# Kernel arguments for Intel Core i5 650 (Clarkdale) crash/freeze fixes.
# Source: https://github.com/vinod2807/linux-pc-crash-fixes
#
#   intel_idle.max_cstate=1             - keep the CPU out of buggy deep C-states
#   snd_hda_intel.power_save=0          - disable HDA codec power saving (pops/hangs)
#   snd_hda_intel.power_save_controller=0 - disable HDA controller power transitions
#
# bootc applies these at install time and also applies the difference to an
# existing installed system on upgrade. See docs/CRASH-FIXES.md.
kargs = [
  "intel_idle.max_cstate=1",
  "snd_hda_intel.power_save=0",
  "snd_hda_intel.power_save_controller=0",
]
match-architectures = ["x86_64"]
