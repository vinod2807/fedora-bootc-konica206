name: weekly-image

# Builds and publishes the bootc image every Sunday at 03:00 IST (Saturday 21:30 UTC), and on
# demand. This workflow NEVER builds an installation ISO.

on:
  schedule:
    # 03:00 IST = 21:30 UTC (previous day)
    - cron: "30 21 * * 6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: weekly-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push linux/amd64 bootc image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Resolve latest ZapFast release
        id: zapfast
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Get the latest release tag (not pre-release) from GitHub API
          tag=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/crmne/zapfast/releases/latest" \
            | jq -r '.tag_name')
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve ZapFast release tag (got '$tag')"
            exit 1
          fi
          {
            echo "version=$tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ZapFast"
            echo "- version: \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set lower-case image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Fedora bootc - Labwc desktop
            org.opencontainers.image.description=Fedora bootc (base follows :latest) linux/amd64 with Labwc, sfwbar, Foot and CUPS printer sharing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first so the image can be smoke-tested before anything is
      # pushed. The second build below reuses this cache.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: localhost/fedora-bootc-konica206:smoke
          labels: ${{ steps.meta.outputs.labels }}
          # The base is a moving tag (:latest): always resolve it against the
          # registry instead of reusing a cached resolution, so a Fedora major
          # release is actually picked up.
          pull: true
          build-args: |
            BUILD_EPOCH=${{ github.run_id }}
            ZAPFAST_VERSION=${{ steps.zapfast.outputs.version }}
          cache-from: type=gha,scope=bootc-image
          cache-to: type=gha,mode=max,scope=bootc-image
          provenance: false
          sbom: false

      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash localhost/fedora-bootc-konica206:smoke -euo pipefail -x -c '
             rpm -q labwc foot greetd tuigreet NetworkManager cups ghostscript Thunar gnome-keyring-pam lxpolkit swayidle >/dev/null
            rpm -q zram-generator >/dev/null
            # The Wine stack was removed from the image; none of it may come back.
            for p in wine wine-core wine-mono winetricks; do
              ! rpm -q "$p" >/dev/null 2>&1
            done
            # Removed apps must not sneak back in (explicitly or via branding).
            for p in lxappearance lxsession brave-browser thunderbird gpodder transmission transmission-qt transmission-gtk gthumb onlyoffice-desktopeditors firefox waybar vlc mpv ffmpeg libavcodec-freeworld gstreamer1-plugin-libav gstreamer1-plugins-ugly retroarch libretro-nestopia libreoffice libreoffice-core kvantum qt5ct qt6ct qt5-qtwayland adw-gtk3-theme rpmfusion-free-release rpmfusion-nonfree-release; do
              ! rpm -q "$p" >/dev/null 2>&1
            done
            test -z "$(rpm -qa | grep -i '^libretro' || true)"
            ! test -e /etc/retroarch.cfg
            ! test -d /usr/share/libretro
            ! test -e /etc/xdg/waybar/config
            ! test -e /usr/share/applications/mpv.desktop
            # sfwbar start-menu WeeChat must open in foot: upstream uses
            # Terminal=true which gio cannot launch without a terminal.
            grep -qx "Exec=foot -e weechat %u" /usr/share/applications/weechat.desktop
            grep -qx "Terminal=false" /usr/share/applications/weechat.desktop
            desktop-file-validate /usr/share/applications/weechat.desktop
            ! grep -qi "lxappearance" /etc/xdg/labwc/menu.xml /usr/share/sfwbar/sfwbar.config
            ! grep -qi "transmission" /etc/xdg/labwc/menu.xml /etc/xdg/labwc/rc.xml
            ! grep -qi "thunderbird" /etc/xdg/labwc/menu.xml /etc/xdg/labwc/rc.xml
            ! grep -qi "firefox" /etc/xdg/labwc/menu.xml /etc/xdg/labwc/rc.xml /usr/share/sfwbar/sfwbar.config
            ! grep -qi "libreoffice" /etc/xdg/labwc/menu.xml /usr/share/sfwbar/sfwbar.config
            ! grep -qi "onlyoffice" /etc/xdg/labwc/menu.xml /usr/share/sfwbar/sfwbar.config
            ! grep -qi "vlc" /etc/xdg/labwc/menu.xml
            ! grep -qi "gthumb" /etc/xdg/labwc/menu.xml /usr/share/sfwbar/sfwbar.config
            ! rpm -q pcmanfm >/dev/null 2>&1
            ! rpm -q swaylock >/dev/null 2>&1
            ! grep -qi "swaylock" /etc/xdg/labwc/autostart
            # MATE was removed; no MATE app or setting panel may sneak back in.
            ! rpm -q mate-control-center mate-polkit >/dev/null 2>&1
            test -f /usr/lib64/security/pam_gnome_keyring.so
            rpm -q zapfast >/dev/null
            # wgpu-based apps (zapfast) abort with
            # "Failed to create surface for any enabled backend" when no Vulkan
            # ICD is installed. mesa-vulkan-drivers provides lavapipe (software
            # Vulkan), which works on GPUs without a Vulkan driver (e.g. Ironlake).
            rpm -q mesa-vulkan-drivers vulkan-loader >/dev/null
            test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
            for b in /usr/bin/labwc /usr/bin/foot /usr/bin/tuigreet /usr/bin/zapfast; do
              test -x "$b"
            done
            # The Konica printer stack is not built into this image. None of its
            # binaries may reappear (it runs from a restored Podman container).
            for b in /usr/bin/konica206-native /usr/bin/konica-native /usr/bin/konica-send /usr/bin/konica-render /usr/bin/legacy-printer-app; do
              ! test -e "$b"
            done
            /usr/bin/labwc --version
            /usr/bin/foot --version
            /usr/bin/tuigreet --version
            test -f /etc/greetd/config.toml
            grep -q "tuigreet --time --remember --cmd /usr/bin/labwc" /etc/greetd/config.toml
            test -f /usr/lib/bootc/kargs.d/90-linux-pc-crash-fixes.toml
            grep -q "intel_idle.max_cstate=1" /usr/lib/bootc/kargs.d/90-linux-pc-crash-fixes.toml
            # GRUB menu must pause so an older deployment can be selected.
            grep -qx "set timeout=10" /usr/lib/bootupd/grub2-static/grub-static-pre.cfg
            systemctl is-enabled greetd.service NetworkManager.service ecbd.service
            # Konica printer assets were removed from the image on purpose.
            # The runtime queue comes from the restored Podman container.
            for f in \
              /usr/local/bin/konica-cups-watch.sh \
              /usr/local/sbin/check-wineps-route.sh \
              /usr/local/share/konica-retrofit/min-ar.ps \
              /usr/share/konica206/retrofit-commit \
              /etc/cups/wineps.convs \
              /usr/lib/udev/rules.d/70-konica206.rules \
              /usr/lib/udev/rules.d/71-konica206-usb-presence.rules \
              /usr/libexec/konica206/ensure-legacy-queue \
              /usr/share/konica206/legacy-ppd/KonicaMinolta-206-fullbleed.ppd \
              /usr/share/konica206/ppd/KonicaMinolta-206-fullbleed-rotated.ppd \
              /usr/share/ppd/konica206/konica206.ppd \
              /etc/systemd/system/legacy-printer-app.service.d/90-konica206uri.conf \
              /usr/lib/tmpfiles.d/konica206uri.conf; do
              ! test -e "$f"
            done
            for u in konica206-native.service konica206-queue.service konica206-classic-queue.service konica206uri-queue.service konica-cups-watch.service konica-cups-watch.timer legacy-printer-app.service; do
              ! test -e "/usr/lib/systemd/system/$u"
              ! test -e "/etc/systemd/system/$u"
            done
            # The usblp blacklist stays: the container libusb backend needs the
            # interface, so the host kernel driver must not bind it.
            test -f /etc/modprobe.d/90-usblp-blacklist.conf
            grep -qx "blacklist usblp" /etc/modprobe.d/90-usblp-blacklist.conf
            ! rpm -q pappl legacy-printer-app pappl-retrofit >/dev/null 2>&1
            # Suspend/hibernate must stay masked: s2idle hangs on this hardware.
            for t in suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target; do
              test "$(readlink "/etc/systemd/system/$t")" = /dev/null
            done
            ! grep -q "systemctl suspend" /etc/xdg/labwc/autostart
            # labwc takes attribute syntax; Openbox child-element form logs red
            # "Invalid action" errors on every login.
            ! grep -qE "name=\"Desktop\"|name=\"MoveResizeTo\"|<edge>|context=\"Menu\"" /etc/xdg/labwc/rc.xml
            # zram: config must produce a swap unit for /dev/zram0.
            test -f /etc/systemd/zram-generator.conf
            grep -qx "zram-size = min(ram / 2, 4096)" /etc/systemd/zram-generator.conf
            zgen=$(mktemp -d)
            ZRAM_GENERATOR_ROOT=/ /usr/lib/systemd/system-generators/zram-generator "$zgen" "$zgen" "$zgen" >/dev/null 2>&1
            test -f "$zgen/dev-zram0.swap"
            rm -rf "$zgen"
            systemd-analyze verify /usr/lib/systemd/system/bootc-upgrade.service \
                                   /usr/lib/systemd/system/bootc-upgrade.timer
            # Print queues are local-only: no queue unit or helper is baked in.
            for f in /usr/lib/systemd/system/epson-l3260-queue.service \
                     /usr/libexec/epson-l3260/ensure-queue; do
              ! test -e "$f"
            done
            # nmbd must be allowed to wait for a NIC that appears after boot.
            grep -qx 'TimeoutStartSec=0' /usr/lib/systemd/system/nmb.service.d/10-wait-for-interface.conf
            # Konica vendor runtime data and its fixed /usr/local path are gone.
            test ! -e /usr/local/lib/konica
            test ! -e /var/lib/konica206
            # CUPS needs its raster filter for driverless/local queues.
            test -x /usr/lib/cups/filter/pdftoraster
            echo "smoke test: OK"
          '

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          # Do not push directly: the image is rechunked first, and only the
          # rechunked image is published to the registry.
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See the smoke-test step above: the base tag must be re-resolved.
          pull: true
          build-args: |
            BUILD_EPOCH=${{ github.run_id }}
            ZAPFAST_VERSION=${{ steps.zapfast.outputs.version }}
          cache-from: type=gha,scope=bootc-image
          # Build goes to a tar (not directly to the registry) so the next
          # step can rechunk it. Only the rechunked image is published.
          outputs: type=docker,dest=/tmp/bootc-image.tar
          provenance: false
          sbom: false

      - name: Export the built rootfs
        shell: bash
        run: |
          set -euo pipefail
          # Unpack the image into containers/storage with buildah and hand the
          # mounted rootfs to chunkah. buildah applies the OCI layers itself,
          # preserving ownership, setuid/setgid bits and security.capability
          # xattrs. `docker export | tar -x` is not usable here: docker export
          # does not emit security.capability at all, so the result boots to
          # greetd but cannot start a session (autologin dies, sudo/passwd lose
          # setuid, ping/newuidmap lose capabilities).
          sudo buildah rm bootc-rechunk >/dev/null 2>&1 || true
          sudo skopeo copy --quiet docker-archive:/tmp/bootc-image.tar \
            containers-storage:localhost/bootc-build:latest
          # Capture the image config in podman-inspect format, which chunkah
          # understands (labels, entrypoint, env, ...). Keep it OUTSIDE the
          # rootfs so it does not become /image-config.json in the image.
          sudo podman inspect localhost/bootc-build:latest > /tmp/image-config.json
          sudo buildah from --name bootc-rechunk containers-storage:localhost/bootc-build:latest >/dev/null
          ROOTFS=$(sudo buildah mount bootc-rechunk)
          echo "ROOTFS=$ROOTFS" >> "$GITHUB_ENV"
          echo "Rootfs mounted at $ROOTFS"
          # Fail fast if metadata did not survive. A rootfs owned by anything
          # other than root, or missing setuid/capabilities, cannot boot.
          sudo python3 - "$ROOTFS" <<'PY'
          import os, stat, sys
          root = sys.argv[1]
          st = os.stat(root)
          assert (st.st_uid, st.st_gid) == (0, 0), f"rootfs owned by {st.st_uid}:{st.st_gid}"
          assert os.stat(f"{root}/usr/bin/sudo").st_mode & stat.S_ISUID, "sudo lost its setuid bit"
          caps = os.getxattr(f"{root}/usr/bin/newuidmap", "security.capability")
          assert caps, "newuidmap lost its capabilities"
          print("rootfs metadata OK: root-owned, setuid and capabilities intact")
          PY

      - name: Rechunk the image
        shell: bash
        run: |
          set -euo pipefail
          # Rechunk the finished rootfs with chunkah. The output (oci-archive)
          # carries the same labels/config as the built image; the layer
          # boundaries are re-laid so updates only re-download changed chunks.
          #
          # We run chunkah inside a throwaway Fedora container so its tooling
          # is present, without needing to install Fedora tools on the Ubuntu
          # runner. The rootfs is mounted read-only; chunkah reads it and
          # writes the rechunked archive to the mounted /out directory.
          #
          # --config carries the built image's labels/entrypoint/env so the
          # published image is indistinguishable from the built one except
          # for the layer split.
          #
          # bootc/OSTree note (see chunkah README, "Compatibility with
          # bootable (bootc) images"): an OSTree-based bootc image stores its
          # ostree repo under /sysroot and records the layer holding it in the
          # `ostree.final-diffid` label. Rechunking re-lays every layer, so
          # that label would point at a layer that no longer exists and bootc
          # would fail with "Missing ostree.final-diffid". The supported fix
          # is to prune /sysroot/ and drop the ostree labels, which turns the
          # image into a plain (non-OSTree) bootc image. bootc imports those
          # directly from the rootfs; `containers.bootc=1` is kept.
          docker run --rm -v "$ROOTFS":/rechunk:ro -v /tmp:/out quay.io/fedora/fedora:latest bash -c '
            set -euo pipefail
            dnf install -y chunkah
            chunkah build --rootfs /rechunk --config /out/image-config.json \
              --max-layers 64 --compressed --prune /sysroot/ \
              --label ostree.commit- --label ostree.final-diffid- \
              --output oci-archive:/out/rechunked.tar
            ls -lh /out/rechunked.tar
          '
          # Release the buildah mount now that chunkah has read the rootfs.
          sudo buildah umount bootc-rechunk
          sudo buildah rm bootc-rechunk
          echo "Rechunk complete"

      - name: Verify the rechunked image is bootable
        shell: bash
        run: |
          set -euo pipefail
          # Refuse to publish an image bootc cannot import. In particular, an
          # ostree.final-diffid label whose layer was re-laid by chunkah makes
          # `bootc upgrade` fail with "Missing ostree.final-diffid".
          skopeo inspect --config oci-archive:/tmp/rechunked.tar > /tmp/rechunked-config.json
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("/tmp/rechunked-config.json"))
          labels = (cfg.get("config") or {}).get("Labels") or {}
          if labels.get("containers.bootc") != "1":
              sys.exit("rechunked image lost containers.bootc=1")
          for stale in ("ostree.commit", "ostree.final-diffid"):
              if stale in labels:
                  sys.exit(f"rechunked image still has {stale} label")
          print("rechunked image labels OK:", sorted(labels))
          PY

      - name: Push the rechunked image
        shell: bash
        run: |
          set -euo pipefail
          # Push the rechunked archive to every tag produced by the metadata step.
          # shellcheck disable=SC2046
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            skopeo copy --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              oci-archive:/tmp/rechunked.tar "docker://${tag}"
          done

      - name: Report image references
        shell: bash
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo ""
            echo "This workflow does not build an ISO. Use the **build-iso** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
