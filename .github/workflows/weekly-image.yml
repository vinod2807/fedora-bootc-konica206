name: weekly-image

# Builds and publishes the bootc image every Sunday at 03:00 IST (Saturday 21:30 UTC), and on
# demand. This workflow NEVER builds an installation ISO.

on:
  schedule:
    # 03:00 IST = 21:30 UTC (previous day)
    - cron: "30 21 * * 6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: weekly-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push linux/amd64 bootc image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Resolve upstream printer commit SHAs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          app=$(git ls-remote https://github.com/vinod2807/konica206-native-alpine.git refs/heads/main | awk '{print $1}')
          native=$(git ls-remote https://github.com/vinod2807/konica-native-musl.git refs/heads/main | awk '{print $1}')
          retrofit=$(git ls-remote https://github.com/vinod2807/konica-retrofit.git refs/heads/main | awk '{print $1}')
          for ref in "$app" "$native" "$retrofit"; do
            if [[ ! $ref =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve an upstream commit SHA from git ls-remote"
              exit 1
            fi
          done
          {
            echo "app=$app"
            echo "native=$native"
            echo "retrofit=$retrofit"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Printer sources"
            echo "- konica206-native-alpine: \`$app\`"
            echo "- konica-native-musl: \`$native\`"
            echo "- konica-retrofit: \`$retrofit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set lower-case image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Fedora bootc - Cinnamon + Konica bizhub 206
            org.opencontainers.image.description=Fedora bootc (base follows :latest) linux/amd64 with full Cinnamon desktop (Wayland + X11, Slick Greeter autologin) and the Konica Minolta bizhub 206 printer application
            org.vinod2807.konica.app-ref=${{ steps.refs.outputs.app }}
            org.vinod2807.konica.native-ref=${{ steps.refs.outputs.native }}
            org.vinod2807.konica.retrofit-ref=${{ steps.refs.outputs.retrofit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first so the image can be smoke-tested before anything is
      # pushed. The second build below reuses this cache.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: localhost/fedora-bootc-konica206:smoke
          labels: ${{ steps.meta.outputs.labels }}
          # The base is a moving tag (:latest): always resolve it against the
          # registry instead of reusing a cached resolution, so a Fedora major
          # release is actually picked up.
          pull: true
          build-args: |
            BUILD_EPOCH=${{ github.run_id }}
            KONICA_APP_REF=${{ steps.refs.outputs.app }}
            KONICA_NATIVE_REF=${{ steps.refs.outputs.native }}
            KONICA_RETROFIT_REF=${{ steps.refs.outputs.retrofit }}
          cache-from: type=gha,scope=bootc-image
          cache-to: type=gha,mode=max,scope=bootc-image
          provenance: false
          sbom: false

      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash localhost/fedora-bootc-konica206:smoke -euo pipefail -x -c '
            rpm -q cinnamon cinnamon-session lightdm slick-greeter xdg-desktop-portal-gtk NetworkManager pappl cups ghostscript zram-generator mesa-vulkan-drivers vulkan-loader >/dev/null
            test -f /usr/share/xdg-desktop-portal/portals/gtk.portal
            # GNOME 51 desktop must be gone.
            for p in gdm gnome-shell gnome-tweaks gnome-shell-extension-common; do
              ! rpm -q "$p" >/dev/null 2>&1
            done
            # Unwanted cinnamon-desktop group apps are not shipped.
            for p in firefox thunderbird pidgin shotwell zoitechat; do
              ! rpm -q "$p" >/dev/null 2>&1
            done
            # Old labwc/LXQt/greetd stack must not be present.
            for p in greetd tuigreet labwc sfwbar lxqt-session lxqt-panel lxpolkit; do
              ! rpm -q "$p" >/dev/null 2>&1
            done
            # The Wine stack was removed from the image; none of it may come back.
            for p in wine wine-core wine-mono winetricks; do
              ! rpm -q "$p" >/dev/null 2>&1
            done
            test -z "$(rpm -qa | grep -i '\''^libretro'\'' || true)"
            ! test -e /etc/retroarch.cfg
            ! test -d /usr/share/libretro
            # fuzzel-printjobs desktop helper remains available.
            grep -qx "Terminal=false" /usr/share/applications/weechat.desktop
            desktop-file-validate /usr/share/applications/weechat.desktop
            test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
            for b in /usr/bin/konica206-native /usr/bin/konica-native /usr/bin/konica-send /usr/bin/cinnamon; do
              test -x "$b"
            done
            /usr/bin/konica206-native --version
            /usr/bin/konica-native --help >/dev/null 2>&1 || true
            test -f /usr/share/wayland-sessions/cinnamon-wayland.desktop
            test -f /etc/lightdm/lightdm.conf.d/50-cinnamon-autologin.conf
            grep -qx "autologin-user=vinod" /etc/lightdm/lightdm.conf.d/50-cinnamon-autologin.conf
            grep -qx "autologin-session=cinnamon-wayland" /etc/lightdm/lightdm.conf.d/50-cinnamon-autologin.conf
            grep -qE "^session[[:space:]]+required[[:space:]]+pam_selinux\.so open nottys$" /usr/lib/pam.d/lightdm-autologin
            test -f /usr/lib/tmpfiles.d/50-cinnamon-lightdm.conf
            grep -qx "d /var/lib/lightdm 0700 lightdm lightdm -" /usr/lib/tmpfiles.d/50-cinnamon-lightdm.conf
            test -f /usr/lib/bootc/kargs.d/90-linux-pc-crash-fixes.toml
            grep -q "intel_idle.max_cstate=1" /usr/lib/bootc/kargs.d/90-linux-pc-crash-fixes.toml
            # GRUB menu must pause so an older deployment can be selected.
            grep -qx "set timeout=10" /usr/lib/bootupd/grub2-static/grub-static-pre.cfg
            systemctl is-enabled lightdm.service NetworkManager.service konica206-native.service konica206-queue.service konica206-classic-queue.service konica-cups-watch.service konica-cups-watch.timer ecbd.service
            # Vendor runtime data is installed at boot from a configured
            # licensed source, never baked into the image.
            systemctl is-enabled konica206-vendor-data.service
            test -x /usr/libexec/konica206/install-vendor-data-onboot
            test -f /etc/konica206/vendor-data.conf
            test ! -e /var/lib/konica206/vendor/KonicaMinolta/245igdi/Halftones/COPA.DEFAULT.600x600.hft
            # Konica scanner (ar206 SANE backend) is provided for the host.
            rpm -q sane-ar206 >/dev/null
            test -f /usr/lib64/sane/libsane-ar206.so.1.0.0
            test -x /usr/local/bin/konica-scan
            test -f /usr/share/applications/konica-scan.desktop
            # konica-retrofit integration: USB presence watcher covering the
            # native queue and the legacy konica206uri pair, plus the
            # Wine/Adobe PS retype rule.
            test -x /usr/local/bin/konica-cups-watch.sh
            test -x /usr/local/sbin/check-wineps-route.sh
            test -f /usr/local/share/konica-retrofit/min-ar.ps
            test -f /usr/share/konica206/retrofit-commit
            grep -qx "QUEUES=\"konica206 konica206uri konica206uri-ppd\"" /usr/local/bin/konica-cups-watch.sh
            grep -qx "application/vnd.adobe-reader-postscript application/postscript 0 -" /etc/cups/wineps.convs
            test -f /usr/lib/udev/rules.d/71-konica206-usb-presence.rules
            # Legacy konica206uri stack: pappl-retrofit application, the
            # retrofit full-bleed PPD driven by the open encoder, the chunked
            # USB backend, and the runtime queue service.
            rpm -q legacy-printer-app pappl-retrofit avahi libusb1 >/dev/null
            test -x /usr/bin/legacy-printer-app
            test -x /usr/libexec/konica206/ensure-legacy-queue
            test -x /usr/local/libexec/konica-backend/usb
            test -f /usr/share/konica206/legacy-ppd/KonicaMinolta-206-fullbleed.ppd
            grep -qxF "*cupsFilter: \"application/vnd.cups-raster 0 /usr/bin/konica-native\"" /usr/share/konica206/legacy-ppd/KonicaMinolta-206-fullbleed.ppd
            grep -qxF "*DefaultDuplex: None" /usr/share/konica206/legacy-ppd/KonicaMinolta-206-fullbleed.ppd
            ! grep -q "OCM_resourceDir:" /usr/share/konica206/legacy-ppd/KonicaMinolta-206-fullbleed.ppd
            # cupsBackSide is path-specific. CUPS pdftoraster (shim PPD raster
            # chain) and the legacy chain need Rotated; the app's builtin PDF
            # renderer must NOT pre-rotate duplex backs (the 206 binds long edge
            # itself), so it reads a derived Normal PPD. See docs/PRINTER.md.
            grep -qxF "*cupsBackSide: Rotated" /usr/share/konica206/legacy-ppd/KonicaMinolta-206-fullbleed.ppd
            grep -qxF "*cupsBackSide: Rotated" /usr/share/ppd/konica206/konica206.ppd
            test -f /usr/share/konica206/ppd/KonicaMinolta-206-fullbleed-rotated.ppd
            grep -qxF "*cupsBackSide: Rotated" /usr/share/konica206/ppd/KonicaMinolta-206-fullbleed-rotated.ppd
            test -f /usr/share/konica206/ppd/KonicaMinolta-206-native-normal.ppd
            grep -qxF "*cupsBackSide: Normal" /usr/share/konica206/ppd/KonicaMinolta-206-native-normal.ppd
            grep -qx "Environment=KONICA_PPD=/usr/share/konica206/ppd/KonicaMinolta-206-native-normal.ppd" /usr/lib/systemd/system/konica206-native.service
            # The shim PPD must not accept PDF (forces CUPS raster path via pdftoraster).
            ! grep -q "application/vnd.cups-pdf" /usr/share/ppd/konica206/konica206.ppd
            grep -qx "Environment=PPD_PATHS=/usr/share/konica206/legacy-ppd:/usr/share/cups/model:/usr/lib/cups/driver" /etc/systemd/system/legacy-printer-app.service.d/90-konica206uri.conf
            grep -q "server-port=8000" /etc/systemd/system/legacy-printer-app.service.d/90-konica206uri.conf
            ! grep -q "server-port=8001" /etc/systemd/system/legacy-printer-app.service.d/90-konica206uri.conf
            test -f /usr/lib/tmpfiles.d/konica206uri.conf
            systemctl is-enabled legacy-printer-app.service konica206uri-queue.service avahi-daemon.service
            # Suspend/hibernate must stay masked: s2idle hangs on this hardware.
            for t in suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target; do
              test "$(readlink "/etc/systemd/system/$t")" = /dev/null
            done
            # zram: config must produce a swap unit for /dev/zram0.
            test -f /etc/systemd/zram-generator.conf
            grep -qx "zram-size = min(ram / 2, 4096)" /etc/systemd/zram-generator.conf
            zgen=$(mktemp -d)
            ZRAM_GENERATOR_ROOT=/ /usr/lib/systemd/system-generators/zram-generator "$zgen" "$zgen" "$zgen" >/dev/null 2>&1
            test -f "$zgen/dev-zram0.swap"
            rm -rf "$zgen"
            systemd-analyze verify /usr/lib/systemd/system/konica206-native.service \
                                   /usr/lib/systemd/system/konica206-queue.service \
                                   /usr/lib/systemd/system/konica206-classic-queue.service \
                                   /usr/lib/systemd/system/konica206uri-queue.service \
                                   /usr/lib/systemd/system/konica-cups-watch.service \
                                   /usr/lib/systemd/system/konica-cups-watch.timer \
                                   /usr/lib/systemd/system/bootc-upgrade.service \
                                   /usr/lib/systemd/system/bootc-upgrade.timer
            # nmbd must be allowed to wait for a NIC that appears after boot.
            grep -qx '\''TimeoutStartSec=0'\'' /usr/lib/systemd/system/nmb.service.d/10-wait-for-interface.conf
            # Vendor-owned runtime data must never be baked into the public image.
            # The encoder fixed /usr/local path must point at writable state.
            test "$(readlink -f /usr/local/lib/konica)" = "/var/lib/konica206/vendor"
            test -d /var/lib/konica206/vendor
            test ! -e /usr/local/lib/konica/KonicaMinolta/245igdi/Halftones/COPA.DEFAULT.600x600.hft
            test ! -e /var/lib/konica206/vendor/KonicaMinolta/245igdi/Halftones/COPA.DEFAULT.600x600.hft
            test ! -e /usr/local/lib/konica/KonicaMinolta/245igdi/Profiles/sRGB.icm
            test ! -e /var/lib/konica206/vendor/KonicaMinolta/245igdi/Profiles/sGrayInv.icm
            # Raster jobs use the CUPS pdftoraster filter; PDF jobs use builtin rendering.
            test -x /usr/lib/cups/filter/pdftoraster
            echo "smoke test: OK"
          '

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          # Do not push directly: the image is rechunked first, and only the
          # rechunked image is published to the registry.
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See the smoke-test step above: the base tag must be re-resolved.
          pull: true
          build-args: |
            BUILD_EPOCH=${{ github.run_id }}
            KONICA_APP_REF=${{ steps.refs.outputs.app }}
            KONICA_NATIVE_REF=${{ steps.refs.outputs.native }}
            KONICA_RETROFIT_REF=${{ steps.refs.outputs.retrofit }}
          cache-from: type=gha,scope=bootc-image
          # Build goes to a tar (not directly to the registry) so the next
          # step can rechunk it. Only the rechunked image is published.
          outputs: type=docker,dest=/tmp/bootc-image.tar
          provenance: false
          sbom: false

      - name: Export the built rootfs
        shell: bash
        run: |
          set -euo pipefail
          # Unpack the image into containers/storage with buildah and hand the
          # mounted rootfs to chunkah. buildah applies the OCI layers itself,
          # preserving ownership, setuid/setgid bits and security.capability
          # xattrs. `docker export | tar -x` is not usable here: docker export
          # does not emit security.capability at all, so the result boots to
          # greetd but cannot start a session (autologin dies, sudo/passwd lose
          # setuid, ping/newuidmap lose capabilities).
          sudo buildah rm bootc-rechunk >/dev/null 2>&1 || true
          sudo skopeo copy --quiet docker-archive:/tmp/bootc-image.tar \
            containers-storage:localhost/bootc-build:latest
          # Capture the image config in podman-inspect format, which chunkah
          # understands (labels, entrypoint, env, ...). Keep it OUTSIDE the
          # rootfs so it does not become /image-config.json in the image.
          sudo podman inspect localhost/bootc-build:latest > /tmp/image-config.json
          sudo buildah from --name bootc-rechunk containers-storage:localhost/bootc-build:latest >/dev/null
          ROOTFS=$(sudo buildah mount bootc-rechunk)
          echo "ROOTFS=$ROOTFS" >> "$GITHUB_ENV"
          echo "Rootfs mounted at $ROOTFS"
          # Fail fast if metadata did not survive. A rootfs owned by anything
          # other than root, or missing setuid/capabilities, cannot boot.
          sudo python3 - "$ROOTFS" <<'PY'
          import os, stat, sys
          root = sys.argv[1]
          st = os.stat(root)
          assert (st.st_uid, st.st_gid) == (0, 0), f"rootfs owned by {st.st_uid}:{st.st_gid}"
          assert os.stat(f"{root}/usr/bin/sudo").st_mode & stat.S_ISUID, "sudo lost its setuid bit"
          caps = os.getxattr(f"{root}/usr/bin/newuidmap", "security.capability")
          assert caps, "newuidmap lost its capabilities"
          print("rootfs metadata OK: root-owned, setuid and capabilities intact")
          PY

      - name: Rechunk the image
        shell: bash
        run: |
          set -euo pipefail
          # Rechunk the finished rootfs with chunkah. The output (oci-archive)
          # carries the same labels/config as the built image; the layer
          # boundaries are re-laid so updates only re-download changed chunks.
          #
          # We run chunkah inside a throwaway Fedora container so its tooling
          # is present, without needing to install Fedora tools on the Ubuntu
          # runner. The rootfs is mounted read-only; chunkah reads it and
          # writes the rechunked archive to the mounted /out directory.
          #
          # --config carries the built image's labels/entrypoint/env so the
          # published image is indistinguishable from the built one except
          # for the layer split.
          #
          # bootc/OSTree note (see chunkah README, "Compatibility with
          # bootable (bootc) images"): an OSTree-based bootc image stores its
          # ostree repo under /sysroot and records the layer holding it in the
          # `ostree.final-diffid` label. Rechunking re-lays every layer, so
          # that label would point at a layer that no longer exists and bootc
          # would fail with "Missing ostree.final-diffid". The supported fix
          # is to prune /sysroot/ and drop the ostree labels, which turns the
          # image into a plain (non-OSTree) bootc image. bootc imports those
          # directly from the rootfs; `containers.bootc=1` is kept.
          docker run --rm -v "$ROOTFS":/rechunk:ro -v /tmp:/out quay.io/fedora/fedora:latest bash -c '
            set -euo pipefail
            dnf install -y chunkah
            chunkah build --rootfs /rechunk --config /out/image-config.json \
              --max-layers 64 --compressed --prune /sysroot/ \
              --label ostree.commit- --label ostree.final-diffid- \
              --output oci-archive:/out/rechunked.tar
            ls -lh /out/rechunked.tar
          '
          # Release the buildah mount now that chunkah has read the rootfs.
          sudo buildah umount bootc-rechunk
          sudo buildah rm bootc-rechunk
          echo "Rechunk complete"

      - name: Verify the rechunked image is bootable
        shell: bash
        run: |
          set -euo pipefail
          # Refuse to publish an image bootc cannot import. In particular, an
          # ostree.final-diffid label whose layer was re-laid by chunkah makes
          # `bootc upgrade` fail with "Missing ostree.final-diffid".
          skopeo inspect --config oci-archive:/tmp/rechunked.tar > /tmp/rechunked-config.json
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("/tmp/rechunked-config.json"))
          labels = (cfg.get("config") or {}).get("Labels") or {}
          if labels.get("containers.bootc") != "1":
              sys.exit("rechunked image lost containers.bootc=1")
          for stale in ("ostree.commit", "ostree.final-diffid"):
              if stale in labels:
                  sys.exit(f"rechunked image still has {stale} label")
          print("rechunked image labels OK:", sorted(labels))
          PY

      - name: Push the rechunked image
        shell: bash
        run: |
          set -euo pipefail
          # Push the rechunked archive to every tag produced by the metadata step.
          # shellcheck disable=SC2046
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            skopeo copy --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              oci-archive:/tmp/rechunked.tar "docker://${tag}"
          done

      - name: Report image references
        shell: bash
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Printer commit SHAs: app \`${{ steps.refs.outputs.app }}\`, native \`${{ steps.refs.outputs.native }}\`, retrofit \`${{ steps.refs.outputs.retrofit }}\`"
            echo ""
            echo "This workflow does not build an ISO. Use the **build-iso** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
