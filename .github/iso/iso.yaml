label: "KONICA206-BOOTC"
grub2:
  timeout: 10
  entries:
    - name: "Install Fedora bootc (Konica bizhub 206 image)"
      linux: "/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=KONICA206-BOOTC inst.graphical console=tty0 console=ttyS0,115200n8 selinux=0 rhgb quiet"
      initrd: "/images/pxeboot/initrd.img"
