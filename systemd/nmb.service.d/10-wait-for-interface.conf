# nmbd waits for a non-loopback IPv4 interface before reporting readiness.
# On this machine the NIC can take minutes to establish carrier, which is
# longer than systemd's default start timeout, so the unit failed at boot:
#   nmb.service: start operation timed out. Terminating.
# Let nmbd wait for the interface instead of being killed, and restart it if
# it ever exits unexpectedly.
[Service]
TimeoutStartSec=0
Restart=on-failure
RestartSec=15
