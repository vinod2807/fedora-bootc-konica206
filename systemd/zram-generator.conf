# Compressed swap in RAM. zram-generator turns this into /dev/zram0 and a
# systemd swap unit at boot. The size is virtual: only pages actually stored
# in the device consume memory, so half of RAM (capped at 4 GiB) is safe.
#
# This machine has no disk swap; zram gives the kernel somewhere to put cold
# pages without touching the disk. zstd compresses better than lzo-rle at a
# modest CPU cost, which this i5-650 can afford.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
