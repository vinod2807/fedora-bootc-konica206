[Timer]
# Upstream (Fedora bootc base image) schedules this as "1 h after boot, then
# every 8 h", which can stage + reboot in the middle of the working day.
# Replace that with a single nightly window instead: clear the two monotonic
# timers and use a calendar timer.
OnBootSec=
OnUnitInactiveSec=
OnCalendar=*-*-* 04:00:00
RandomizedDelaySec=30m
# If the machine was off at 04:00, run the update on the next boot.
Persistent=true
