# konica206uri: drive the Legacy Printer Application from the konica-retrofit
# full-bleed PPD, whose CUPS filter is the open konica-native encoder.
#
# The packaged configuration listens on 8001, which is the native
# konica206 application's port, so the port is overridden here. PPD_PATHS
# points the application at the retrofit PPD staged under /usr/share; the
# default CUPS model/driver paths stay in the list.
#
# The PPD at /usr/share/konica206/legacy-ppd/KonicaMinolta-206-fullbleed.ppd
# has *cupsBackSide: Normal (set at image build). The 206's duplexer binds
# long edge itself from konica-native's PJL BINDING, so no pre-rotation.
[Unit]
After=avahi-daemon.service cups.service
Wants=avahi-daemon.service cups.service

[Service]
Environment=HOME=/var/lib/legacy-printer-app
Environment=PPD_PATHS=/usr/share/konica206/legacy-ppd:/usr/share/cups/model:/usr/lib/cups/driver
ExecStart=
ExecStart=/usr/bin/legacy-printer-app server -o server-port=8000 -o log-level=info -o backend-directory=/usr/local/libexec/konica-backend
Restart=on-failure
RestartSec=5s
