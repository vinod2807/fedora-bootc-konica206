# zram-generator's ExecStop resets /dev/zram0 at shutdown.  Swap teardown and
# that reset race: the kernel can still report the device busy (EBUSY), which
# systemd turns into "[FAILED] Failed to stop systemd-zram-setup@zram0.service"
# even though the RAM-backed swap is discarded on power-off anyway.  The "-"
# prefix makes a lost race non-fatal while still attempting the reset (and
# still resetting when the service is stopped manually).
[Service]
ExecStop=
ExecStop=-/usr/lib/systemd/system-generators/zram-generator --reset-device %i
