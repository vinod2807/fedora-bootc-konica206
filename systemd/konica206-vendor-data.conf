# Source for the licensed Konica Minolta 245igdi runtime data that the
# konica206-native encoder needs (Halftones/COPA.DEFAULT.600x600.hft,
# Profiles/sRGB.icm, Profiles/sGrayInv.icm).
#
# Accepted values:
#   - a directory containing KonicaMinolta/245igdi, 245igdi, or Halftones/
#     and Profiles/ directly
#   - a local archive: .tar, .tar.gz, .tgz, .tar.xz, .txz or .zip
#   - an http(s) URL to such an archive
#
# Leave empty to skip. The data is proprietary, so it is never baked into the
# image; konica206-vendor-data.service installs it at boot when missing.
KONICA_VENDOR_SOURCE=/var/home/vinod/konica-retrofit/backup/usr/local/lib/konica/KonicaMinolta/245igdi
